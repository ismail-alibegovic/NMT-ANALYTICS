name: Travline Staging Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: travline-staging-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  ACCEPTANCE_EVIDENCE_DIR: acceptance-evidence

jobs:
  acceptance:
    name: Isolated Supabase acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            nmt-analytics-api/package-lock.json
            nmt-analytics-admin/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Install API dependencies
        working-directory: nmt-analytics-api
        run: npm ci

      - name: Install admin dependencies
        working-directory: nmt-analytics-admin
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: nmt-analytics-admin
        run: npx playwright install --with-deps chromium

      - name: Start isolated Supabase PostgreSQL 17, Auth, Storage and SMTP
        working-directory: nmt-analytics-api
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          npm run staging:up > "$RUNNER_TEMP/supabase-start.log" 2>&1
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          env_value() {
            grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'
          }
          {
            echo "TRAVLINE_SUPABASE_URL=$(env_value API_URL)"
            echo "TRAVLINE_SUPABASE_ANON_KEY=$(env_value ANON_KEY)"
            echo "TRAVLINE_SUPABASE_SERVICE_ROLE_KEY=$(env_value SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      - name: Replay complete migration history
        working-directory: nmt-analytics-api
        run: |
          supabase db reset --local --yes
          mkdir -p "$GITHUB_WORKSPACE/$ACCEPTANCE_EVIDENCE_DIR"
          supabase status > "$GITHUB_WORKSPACE/$ACCEPTANCE_EVIDENCE_DIR/supabase-status.txt"
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -Atc "select version(), current_setting('server_version_num');" \
            > "$GITHUB_WORKSPACE/$ACCEPTANCE_EVIDENCE_DIR/postgres-version.txt"

      - name: Verify privileged function ACLs and passenger-group triggers
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f nmt-analytics-api/scripts/database-function-security.sql

      - name: Create isolated API and admin environment
        run: |
          cat > nmt-analytics-api/.env <<EOF
          NODE_ENV=development
          PORT=3001
          ADMIN_URL=http://127.0.0.1:3001
          TRAVLINE_SUPABASE_URL=$TRAVLINE_SUPABASE_URL
          TRAVLINE_SUPABASE_ANON_KEY=$TRAVLINE_SUPABASE_ANON_KEY
          TRAVLINE_SUPABASE_SERVICE_ROLE_KEY=$TRAVLINE_SUPABASE_SERVICE_ROLE_KEY
          EOF
          chmod 600 nmt-analytics-api/.env
          npm run build --prefix nmt-analytics-api
          VITE_SUPABASE_URL="$TRAVLINE_SUPABASE_URL" \
          VITE_SUPABASE_ANON_KEY="$TRAVLINE_SUPABASE_ANON_KEY" \
          VITE_API_URL=/api \
            npm run build --prefix nmt-analytics-admin

      - name: Seed synthetic two-tenant BAM pilot
        working-directory: nmt-analytics-api
        env:
          E2E_SEED_PASSWORD: ${{ secrets.TRAVLINE_E2E_SEED_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$E2E_SEED_PASSWORD" || {
            echo "BLOCKED: repository secret TRAVLINE_E2E_SEED_PASSWORD is not configured"
            exit 1
          }
          DOTENV_CONFIG_QUIET=true E2E_SEED_PASSWORD="$E2E_SEED_PASSWORD" \
            npm --silent run seed:acceptance > "$RUNNER_TEMP/seed.json" 2> "$RUNNER_TEMP/seed.log"
          node - <<'NODE'
          const fs = require('fs');
          const seedPath = process.env.RUNNER_TEMP + '/seed.json';
          const seed = JSON.parse(fs.readFileSync(seedPath, 'utf8'));
          const required = [
            'password', 'directorId', 'managerId', 'staffId', 'otherTenantId', 'orgA', 'orgB',
            'packageId', 'departureId', 'customerId', 'hotelAllocationId', 'recoveryReservationId',
          ];
          if (!seed || typeof seed !== 'object' || required.some((key) => typeof seed[key] !== 'string' || seed[key] === '')) {
            throw new Error('Acceptance seed output is missing required fields.');
          }
          const env = [
            ['E2E_BASE_URL', 'http://127.0.0.1:3001'],
            ['E2E_API_URL', 'http://127.0.0.1:3001'],
            ['E2E_SUPABASE_URL', process.env.TRAVLINE_SUPABASE_URL],
            ['E2E_SUPABASE_ANON_KEY', process.env.TRAVLINE_SUPABASE_ANON_KEY],
            ['E2E_DIRECTOR_EMAIL', 'director@audit.test'],
            ['E2E_DIRECTOR_PASSWORD', seed.password],
            ['E2E_MANAGER_EMAIL', 'manager@pilot-a.test'],
            ['E2E_MANAGER_PASSWORD', seed.password],
            ['E2E_STAFF_EMAIL', 'staff@pilot-a.test'],
            ['E2E_STAFF_PASSWORD', seed.password],
            ['E2E_OTHER_TENANT_EMAIL', 'manager@pilot-b.test'],
            ['E2E_OTHER_TENANT_PASSWORD', seed.password],
            ['E2E_DEPARTURE_ID', seed.departureId],
            ['E2E_CUSTOMER_ID', seed.customerId],
            ['E2E_HOTEL_ALLOCATION_ID', seed.hotelAllocationId],
            ['E2E_RECOVERY_RESERVATION_ID', seed.recoveryReservationId],
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, env.map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          NODE

      - name: Start API serving the built admin
        run: |
          (cd nmt-analytics-api && npm start > "$RUNNER_TEMP/api.log" 2>&1 & echo $! > "$RUNNER_TEMP/api.pid")
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3001/api/health && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3001/api/health > "$ACCEPTANCE_EVIDENCE_DIR/api-health.json"

      - name: Run authenticated Playwright acceptance
        working-directory: nmt-analytics-admin
        env:
          CI: "true"
          E2E_RUN_BROWSER: "1"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/acceptance-evidence/playwright-results.xml
        run: npm run test:e2e

      - name: Verify isolated Storage and SMTP delivery
        env:
          E2E_MANAGER_EMAIL: manager@pilot-a.test
        run: node scripts/acceptance-services.mjs

      - name: Sanitize process logs
        if: always()
        run: |
          mkdir -p "$ACCEPTANCE_EVIDENCE_DIR"
          for log in "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/seed.log"; do
            if [ -f "$log" ]; then
              sed -E 's/(Service Role Key: ).*/\1[redacted]/g; s/(service_role[^[:space:]]*)/[redacted]/g' "$log" \
                > "$ACCEPTANCE_EVIDENCE_DIR/$(basename "$log")"
            fi
          done

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travline-staging-acceptance-${{ github.sha }}
          path: |
            acceptance-evidence/
            nmt-analytics-admin/playwright-report/
            nmt-analytics-admin/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable Supabase stack
        if: always()
        working-directory: nmt-analytics-api
        run: supabase stop --no-backup

