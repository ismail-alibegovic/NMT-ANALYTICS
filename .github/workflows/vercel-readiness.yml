name: Vercel Readiness

on:
  push:
    branches: [infra/vercel-independent]
  pull_request:
    branches: [main]

jobs:
  secret-readiness:
    name: Check Vercel deployment secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secret presence without exposing values
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' }}
          HAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          echo "VERCEL_TOKEN_PRESENT=${HAS_VERCEL_TOKEN}"
          echo "SUPABASE_URL_PRESENT=${HAS_SUPABASE_URL}"
          echo "SUPABASE_ANON_KEY_PRESENT=${HAS_SUPABASE_ANON_KEY}"
          echo "SUPABASE_SERVICE_ROLE_KEY_PRESENT=${HAS_SUPABASE_SERVICE_ROLE_KEY}"
          if [ "${HAS_SUPABASE_URL}" != "true" ] || [ "${HAS_SUPABASE_ANON_KEY}" != "true" ] || [ "${HAS_SUPABASE_SERVICE_ROLE_KEY}" != "true" ]; then
            echo "Required Supabase GitHub secrets are missing."
            exit 1
          fi
